name: Atualizar layout dos fixos
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Melhorar layout da aba de fixos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gastos-fixos.html')
          s = p.read_text(encoding='utf-8')
          if 'fixedAside' in s:
              Path('.github/workflows/layout-fixos.yml').unlink(missing_ok=True)
              raise SystemExit(0)
          s = s.replace('max-width:1250px}.head', 'max-width:none;width:100%}.head')
          s = s.replace('grid-template-columns:minmax(0,1fr) 300px', 'grid-template-columns:minmax(0,1fr) 360px')
          anchor = '</div></section></div><section class="panel monthly">'
          aside = '''</div><div class="fixedAside"><div class="asideTitle"><span>📅 Visão do mês</span><span class="muted">Resumo rápido</span></div><div class="asideStats"><div><span>Entradas</span><b id="asideIn" class="green">R$ 0,00</b></div><div><span>Gastos</span><b id="asideOut" class="red">R$ 0,00</b></div><div><span>Sobra</span><b id="asideNet" class="purple">R$ 0,00</b></div></div><div class="asideSub">Próximos compromissos</div><div id="asideUpcoming" class="asideUpcoming"><span class="muted">Nenhum fixo cadastrado.</span></div></div></section></div><section class="panel monthly">'''
          if anchor not in s:
              raise SystemExit('anchor not found')
          s = s.replace(anchor, aside, 1)
          css_anchor = '@media(max-width:1050px){.mainGrid{grid-template-columns:1fr}'
          extra_css = '''.fixedAside{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.asideTitle{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font:800 14px Manrope;margin-bottom:12px}.asideStats{display:grid;grid-template-columns:1fr;gap:8px}.asideStats>div{display:flex;justify-content:space-between;align-items:center;background:#fafbfe;border:1px solid var(--line);border-radius:9px;padding:9px 10px}.asideStats span{font-size:10px;color:var(--muted)}.asideStats b{font:800 13px Manrope}.asideSub{font:800 11px Manrope;margin:16px 0 8px}.asideUpcoming{display:grid;gap:7px}.asideItem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#fff}.asideItemMain{min-width:0}.asideItemName{display:block;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asideItemDay{display:block;font-size:9px;color:var(--muted);margin-top:2px}.asideItemValue{font-size:10px;font-weight:800;white-space:nowrap}.asideItem.out .asideItemValue{color:var(--red)}.asideItem.in .asideItemValue{color:var(--green)}'''
          s = s.replace(css_anchor, extra_css + css_anchor, 1)
          js = '''<script>(function(){const q=id=>document.getElementById(id);const copy=(a,b)=>{const x=q(a),y=q(b);if(x&&y)y.textContent=x.textContent};function updateAside(){copy('totalIn','asideIn');copy('totalOut','asideOut');copy('leftOver','asideNet');const box=q('asideUpcoming'),rows=[...document.querySelectorAll('#inBody tr,#outBody tr')];if(!box)return;const items=rows.map(r=>{const c=r.querySelectorAll('td');if(c.length<4)return null;const day=(c[2]?.textContent.match(/\d+/)||[])[0];const val=c[1]?.textContent.trim()||'';const name=c[0]?.textContent.trim()||'';const out=r.closest('#outBody')!=null;return day?{day:+day,name,val,out}:null}).filter(Boolean).sort((a,b)=>a.day-b.day).slice(0,5);box.innerHTML=items.length?items.map(x=>`<div class="asideItem ${x.out?'out':'in'}"><div class="asideItemMain"><span class="asideItemName">${x.name}</span><span class="asideItemDay">Dia ${x.day}</span></div><span class="asideItemValue">${x.val}</span></div>`).join(''):'<span class="muted">Nenhum fixo cadastrado.</span>'}const obs=new MutationObserver(updateAside);['totalIn','totalOut','leftOver','inBody','outBody'].forEach(id=>{const e=q(id);if(e)obs.observe(e,{childList:true,subtree:true,characterData:true})});setInterval(updateAside,1000);updateAside()})();</script>'''
          s = s.replace('</body></html>', js + '</body></html>')
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/layout-fixos.yml').unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gastos-fixos.html .github/workflows/layout-fixos.yml
          git commit -m "Melhora layout da aba de fixos"
          git push
