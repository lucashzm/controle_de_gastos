<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle Financeiro</title><link rel="icon" href="favicon.svg"></head><body><div id="loader" style="font:14px system-ui;padding:30px;color:#172033">Carregando seu controle financeiro...</div><script>(async()=>{const raw='https://raw.githubusercontent.com/lucashzm/controle_de_gastos/ffc96dbaceee971287b4829a1bcfa887d1274cbf/index.html';try{let html=await(await fetch(raw,{cache:'no-store'})).text();const detailCss='<style>.launchRow{cursor:pointer;transition:background .15s}.launchRow:hover{background:#faf9ff}.detailModalInfo{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:15px}.detailItem{padding:11px 12px;background:#f8f9fc;border:1px solid #eef1f5;border-radius:10px}.detailItem.full{grid-column:span 2}.detailItem label{display:block;font-size:9px;font-weight:800;color:#758096;text-transform:uppercase;margin-bottom:4px}.detailItem b{font-size:12px}.detailObs{white-space:pre-wrap;line-height:1.5;font-size:12px;color:#536077}.detailParts{margin-top:14px;border-top:1px solid #eef1f5;padding-top:12px}.detailPartsTitle{font-size:11px;font-weight:800;margin-bottom:7px}.detailPartRow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef1f5;font-size:10px}.detailHint{margin-top:10px;font-size:10px;color:#758096}@media(max-width:650px){.detailModalInfo{grid-template-columns:1fr}.detailItem.full{grid-column:auto}}</style>';const detailModal='<div id="detailModal" class="modal"><div class="modalbox"><div class="modalhead"><div><h3 id="detailTitle">Detalhes do lançamento</h3><p class="muted">Confira todas as informações registradas.</p></div><button class="close" id="detailClose">×</button></div><div id="detailContent"></div><div class="modalactions"><button type="button" class="secondary" id="detailEdit">✏️ Editar lançamento</button><button type="button" class="secondary" id="detailClose2">Fechar</button></div></div></div>';const helper='function periodRows(a,b){const ok=d=>(!a||d>=a)&&(!b||d<=b),parentIds=new Set(parts.map(p=>+p.lancamento_id));const direct=rows.filter(r=>ok(r.data)&&!(r.tipo===\'saida\'&&r.forma_pagamento===\'Cartão de crédito\'&&parentIds.has(+r.id)));const parcelRows=parts.filter(p=>ok(p.fatura_competencia)).map(p=>{const l=rows.find(r=>+r.id===+p.lancamento_id);return l?{...l,id:\'parcela-\'+p.id,data:p.fatura_competencia,valor:p.valor,parcela_numero:p.numero,total_parcelas:p.total_parcelas}:null}).filter(Boolean);return direct.concat(parcelRows)}';const charts='function renderCharts(){let now=new Date(),months=[];for(let i=-1;i<=4;i++){let d=new Date(now.getFullYear(),now.getMonth()+i,1);months.push({k:d.getFullYear()+\'-\'+String(d.getMonth()+1).padStart(2,\'0\'),n:d.toLocaleDateString(\'pt-BR\',{month:\'short\'}),e:0,s:0})}let all=periodRows(\'\',\'\');all.forEach(r=>{let m=months.find(x=>x.k===r.data.slice(0,7));if(m)r.tipo===\'entrada\'?m.e+=+r.valor:r.tipo===\'saida\'&&(m.s+=+r.valor)});let max=Math.max(1,...months.flatMap(m=>[m.e,m.s]));$(\'bars\').innerHTML=months.map(m=>\'<div class="grp"><i class="bar" style="height:\'+Math.max(2,m.e/max*100)+\'%"></i><i class="bar s" style="height:\'+Math.max(2,m.s/max*100)+\'%"></i></div>\').join(\'\');$(\'barlabels\').innerHTML=months.map(m=>\'<span>\'+m.n+\'</span>\').join(\'\');let a=$(\'filterStart\').value,b=$(\'filterEnd\').value,periodRowsFiltered=periodRows(a,b),by={};periodRowsFiltered.filter(r=>r.tipo===\'saida\').forEach(r=>by[r.categoria_id||0]=(by[r.categoria_id||0]||0)+ +r.valor);let list=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,5),sum=list.reduce((s,x)=>s+x[1],0),deg=0;$(\'catTotal\').textContent=brl(sum);let stops=list.map((x,i)=>{let d=sum?x[1]/sum*360:0,s=\'hsl(\'+(245+i*38)+\' 70% 58%) \'+deg+\'deg \'+(deg+d)+\'deg\';deg+=d;return s}).join(\',\');$(\'donut\').style.background=list.length?\'conic-gradient(\'+stops+\')\':\'#e9edf3\';$(\'catLegend\').innerHTML=list.map((x,i)=>\'<div class="catLegendRow"><i class="catDot" style="background:hsl(\'+(245+i*38)+\' 70% 58%)"></i><span>\'+esc(catName(x[0]))+\'</span><b>\'+brl(x[1])+\'</b></div>\').join(\'\')||\'<span class="muted">Nenhuma saída no período.</span>\'}';const render='function render(){let a=$(\'filterStart\').value,b=$(\'filterEnd\').value,f=periodRows(a,b),e=f.filter(r=>r.tipo===\'entrada\').reduce((s,r)=>s+ +r.valor,0),s=f.filter(r=>r.tipo===\'saida\').reduce((s,r)=>s+ +r.valor,0);$(\'entradas\').textContent=brl(e);$(\'saidas\').textContent=brl(s);$(\'saldo\').textContent=brl(e-s);$(\'count\').textContent=f.length;let d=getDisplayRows(),p=d.slice((listPage-1)*10,listPage*10);$(\'listBody\').innerHTML=p.map(r=>\'<tr class="launchRow" onclick="showLaunch(\'+r.id+\')"><td>\'+r.data.split(\'-\').reverse().join(\'/\')+\'</td><td><span class="pill \'+(r.tipo===\'entrada\'?\'e\':r.tipo===\'investimento\'?\'i\':\'s\')+\'">\'+(r.tipo===\'entrada\'?\'Entrada\':r.tipo===\'investimento\'?\'Investimento\':\'Saída\')+\'</span></td><td><b>\'+esc(r.descricao)+\'</b>\'+(r.gasto_fixo_id||r.ganho_fixo_id?\' <small class="muted">• fixo</small>\':\'\')+\'</td><td>\'+esc(catName(r.categoria_id))+\'</td><td>\'+esc(r.forma_pagamento||\'—\')+\'</td><td><b>\'+brl(r.valor)+\'</b></td><td><div class="rowActions"><button class="small secondary" onclick="event.stopPropagation();editLaunch(\'+r.id+\')">✏️ Editar</button><button class="small danger" onclick="event.stopPropagation();deleteLaunch(\'+r.id+\')">🗑️ Excluir</button></div></td></tr>\').join(\'\')||\'<tr><td colspan="7" class="muted" style="text-align:center;padding:30px">Nenhum lançamento cadastrado.</td></tr>\';renderListPagination(d.length);renderInvoice();renderCharts();renderParts()}';html=html.replace(/<\/style>/,detailCss+\'<style>.pill.i{background:#eef0ff;color:#5546d9}.investmentHint{font-size:10px;color:#758096;margin-top:3px}</style>\'+\'</style>\').replace(/<\/body>/,detailModal+'</body>');html=html.replace(/function renderCharts\(\)\{[\s\S]*?\}let listPage=/,helper+charts+'let listPage=').replace(/function render\(\)\{[\s\S]*?\}function renderParts/,render+'function renderParts');const detailScript='<script>function showLaunch(id){let r=rows.find(x=>+x.id===+id);if(!r)return;let ps=parts.filter(p=>+p.lancamento_id===+r.id);$("detailTitle").textContent=r.descricao||"Detalhes do lançamento";let tipo=r.tipo===\'entrada\'?\'Entrada\':r.tipo===\'investimento\'?\'Investimento (aplicação)\':\'Saída (gasto)\',obs=r.observacao?esc(r.observacao):\'<span class="muted">Nenhuma observação informada.</span>\',parcel=ps.length?`${ps[0].total_parcelas}x`:\'À vista\';$("detailContent").innerHTML=`<div class="detailModalInfo"><div class="detailItem"><label>Tipo</label><b>${tipo}</b></div><div class="detailItem"><label>Valor</label><b>${brl(r.valor)}</b></div><div class="detailItem"><label>Data</label><b>${r.data.split(\'-\').reverse().join(\'/\')}</b></div><div class="detailItem"><label>Categoria</label><b>${esc(catName(r.categoria_id))}</b></div><div class="detailItem"><label>Forma de pagamento</label><b>${esc(r.forma_pagamento||\'—\')}</b></div><div class="detailItem"><label>Parcelamento</label><b>${parcel}</b></div><div class="detailItem full"><label>Observação</label><div class="detailObs">${obs}</div></div></div>${ps.length?`<div class="detailParts"><div class="detailPartsTitle">Parcelas do cartão</div>${ps.map(p=>`<div class="detailPartRow"><span>${p.numero}/${p.total_parcelas} · fatura ${p.fatura_competencia.slice(0,7)}</span><b>${brl(p.valor)}</b></div>`).join(\'\')}</div>`:\'\'}<div class="detailHint">Clique em Editar lançamento para alterar os dados registrados.</div>`;$("detailEdit").onclick=()=>{$("detailModal").classList.remove(\'on\');editLaunch(r.id)};$("detailModal").classList.add(\'on\')};$("detailClose").onclick=$("detailClose2").onclick=()=>$("detailModal").classList.remove(\'on\');$("detailModal").addEventListener(\'click\',e=>{if(e.target.id===\'detailModal\')$("detailModal").classList.remove(\'on\')})<\/script>';const investmentScript='<script>(function(){function setupInvestment(){const t=$("tipo"),c=$("categoria");if(!t)return;if(!Array.from(t.options).some(o=>o.value==="investimento")){const o=document.createElement("option");o.value="investimento";o.textContent="Investimento (aplicação)";t.appendChild(o)}const inv=t.value==="investimento";if(c){c.disabled=inv;if(inv)c.value=""}}setupInvestment();t&&t.addEventListener("change",setupInvestment);const oldRender=window.render;window.render=function(){oldRender();const a=$("filterStart").value,b=$("filterEnd").value,f=periodRows(a,b),e=f.filter(r=>r.tipo==="entrada").reduce((s,r)=>s+ +r.valor,0),s=f.filter(r=>r.tipo==="saida").reduce((s,r)=>s+ +r.valor,0);$("entradas").textContent=brl(e);$("saidas").textContent=brl(s);$("saldo").textContent=brl(e-s)};const oldCardFields=window.cardFields;window.cardFields=function(){oldCardFields();setupInvestment()};const ef=$("editForm");if(ef){const formaField=$("editForma")?.parentElement;const typeField=document.createElement("div");typeField.className="field";typeField.innerHTML='<label>Tipo</label><select id="editTipo"><option value="saida">Saída (gasto)</option><option value="entrada">Entrada</option><option value="investimento">Investimento (aplicação)</option></select>';if(formaField)formaField.before(typeField);const oldEdit=ef.onsubmit;ef.onsubmit=async function(e){e.preventDefault();let r=rows.find(x=>+x.id===+editingId),v={tipo:$("editTipo").value,descricao:$("editDesc").value.trim(),valor:+$("editValor").value,data:$("editData").value,forma_pagamento:$("editForma").value,cartao_id:$("editForma").value==='Cartão de crédito'?1:null,categoria_id:$("editTipo").value==='investimento'?null:($("editCategoria").value?+$('editCategoria').value:null),observacao:$("editObs").value.trim()||null},{error}=await db.from('lancamentos').update(v).eq('id',r.id);if(error)return $("editMsg").textContent=error.message;$("editModal").classList.remove('on');await load()};const oldOpen=window.editLaunch;window.editLaunch=function(id){oldOpen(id);let r=rows.find(x=>+x.id===+id);if(r&&$("editTipo")){ $("editTipo").value=r.tipo||"saida";$("editCategoria").disabled=r.tipo==="investimento";if(r.tipo==="investimento")$("editCategoria").value=""}}}const obs=$("observacao");if(obs&&obs.parentElement){const p=document.createElement("div");p.className="investmentHint";p.textContent="Investimento não entra nos gastos nem no gráfico de gastos por categoria.";obs.parentElement.after(p)}if($("tipo")){const desc=$("descricao");$("tipo").addEventListener("change",function(){const inv=this.value==="investimento";if(desc)desc.placeholder=inv?"Ex.: Reserva, CDB, Tesouro...":""})}})()<\/script>';html=html.replace(/<\/body>/,detailScript+investmentScript+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('loader').textContent='Não foi possível carregar o controle financeiro.';console.error(e)}})()</script></body></html>
