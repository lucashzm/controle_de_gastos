<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle Financeiro</title>
<link rel="icon" href="favicon.svg">
</head>
<body>
<div id="loader" style="font:14px system-ui;padding:30px;color:#172033">Carregando seu controle financeiro...</div>
<script>
(async()=>{
  const raw='https://raw.githubusercontent.com/lucashzm/controle_de_gastos/ffc96dbaceee971287b4829a1bcfa887d1274cbf/index.html';
  try{
    const res=await fetch(raw,{cache:'no-store'});
    if(!res.ok)throw new Error('Falha ao carregar a base: '+res.status);
    let html=await res.text();

    // O código principal mantém rows/cats/parts/payments em escopo local.
    // Os módulos adicionais precisam enxergar exatamente essas mesmas referências.
    html=html.replace(
      'cats=c.data||[];rows=r.data||[];parts=p.data||[];payments=q.data||[];catFill();',
      'cats=c.data||[];rows=r.data||[];parts=p.data||[];payments=q.data||[];window.rows=rows;window.parts=parts;window.cats=cats;window.payments=payments;window.catName=catName;catFill();'
    );

    html=html.replace(
      '</body>',
      '<script src="enhancements.js?v=3"></script><script src="detail-fix.js?v=1"></script><script src="investment-layout.js?v=4"></script></body>'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loader').textContent='Não foi possível carregar o controle financeiro.';
    console.error(e);
  }
})();
</script>
</body>
</html>
